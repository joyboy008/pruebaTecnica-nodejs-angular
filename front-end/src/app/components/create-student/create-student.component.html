<ion-header>
  <ion-toolbar>
    <ion-title>Registrar Estudiante</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="container mt-4 bg-dark text-light p-4 rounded shadow">
    <form (ngSubmit)="crearEstudiante()" #form="ngForm">
      <div class="row g-3">
        <div class="col-md-4">
          <label for="student_name" class="form-label">Nombre del estudiante</label>
          <input type="text" id="student_name" class="form-control bg-secondary text-light border-0"
            [(ngModel)]="student.student_name" name="student_name" required />
        </div>

        <div class="col-md-4">
          <label for="father_name" class="form-label">Nombre del padre</label>
          <input type="text" id="father_name" class="form-control bg-secondary text-light border-0"
            [(ngModel)]="student.father_name" name="father_name" required />
        </div>

        <div class="col-md-4">
          <label for="mother_name" class="form-label">Nombre de la madre</label>
          <input type="text" id="mother_name" class="form-control bg-secondary text-light border-0"
            [(ngModel)]="student.mother_name" name="mother_name" required />
        </div>

        <div class="col-md-4">
          <label for="birth_date" class="form-label">Fecha de nacimiento</label>
          <input type="date" id="birth_date" class="form-control bg-secondary text-light border-0"
            [(ngModel)]="student.birth_date" name="birth_date" required />
        </div>

        <div class="col-md-4">
          <label for="grade_id" class="form-label">Grado</label>
          <select id="grade_id" class="form-select bg-secondary text-light border-0" [(ngModel)]="student.grade_id"
            name="grade_id" required>
            <option value="" disabled selected>Seleccione un grado</option>
            <option *ngFor="let grade of grades" [value]="grade.id">{{ grade.name }}</option>
          </select>
        </div>

        <div class="col-md-4">
          <label for="section" class="form-label text-light">Sección</label>
          <select id="section" class="form-select bg-secondary text-light border-0" [(ngModel)]="student.section"
            name="section" required>
            <option value="" disabled selected>Selecciona una sección</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
          </select>
        </div>


        <div class="col-md-4">
          <label for="admission_date" class="form-label">Fecha de admisión</label>
          <input type="date" id="admission_date" class="form-control bg-secondary text-light border-0"
            [(ngModel)]="student.admission_date" name="admission_date" required />
        </div>
      </div>

      <div class="d-grid gap-2 col-md-4 mx-auto mt-4">
        <button type="submit" class="btn btn-outline-light" [disabled]="form.invalid">Crear Estudiante</button>
      </div>

      <p class="mt-3 text-success text-center" *ngIf="message">{{ message }}</p>
    </form>
  </div>
</ion-content>
