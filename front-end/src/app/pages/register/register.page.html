<ion-header>
  <ion-toolbar>
    <ion-title class="ion-text-center">Registro</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding ion-text-center">
  <div class="form-container">
    <form (ngSubmit)="registrar()">
      <ion-item lines="none">
        <ion-label position="floating">Usuario</ion-label>
        <ion-input [(ngModel)]="username" name="username" required></ion-input>
      </ion-item>

      <ion-item lines="none">
        <ion-label position="floating">Contraseña</ion-label>
        <ion-input [(ngModel)]="password" name="password" type="password" required></ion-input>
      </ion-item>

      <ion-text color="danger" *ngIf="password && !passwordValida" style="font-size: 13px;">
        <p class="ion-padding-top">
          La contraseña debe tener al menos 8 caracteres, una mayúscula, una minúscula, un número y un símbolo.
        </p>
      </ion-text>

      <ion-button expand="block" type="submit" [disabled]="!passwordValida" class="ion-margin-top">
        Registrar
      </ion-button>
    </form>

    <p class="ion-text-center ion-margin-top">{{ mensaje }}</p>
  </div>
</ion-content>
